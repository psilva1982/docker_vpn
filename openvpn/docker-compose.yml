services:
  openvpn:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/openvpn-server:latest
    restart: unless-stopped
    ports:
      - "1194:1194/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - openvpn-state:/var/lib/openvpn
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pidof openvpn >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  openvpn-state:
