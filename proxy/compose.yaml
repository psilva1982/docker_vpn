services:
  proxy:
    build:
      context: .
    image: local/squid-proxy:latest
    restart: unless-stopped
    environment:
      PROXY_MODE: ${PROXY_MODE:-auth}
    ports:
      - "3128:3128/tcp"
    volumes:
      - ./artifacts:/run/proxy-auth:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3128"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
